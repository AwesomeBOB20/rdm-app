<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Announcement emails · RDM</title>

<!-- WHY THIS PAGE IS STATIC HTML AND NOT A ROUTE IN THE APP (Anthony, 2026-08-09)

     The unsubscribe page used to be rendered by the announce-unsubscribe edge function. It arrived as a
     wall of raw source instead of a page, because Supabase serves EVERY function on *.supabase.co with
     `Content-Type: text/plain`, `X-Content-Type-Options: nosniff` and `default-src 'none'; sandbox`. That
     is an anti-phishing policy on their shared domain, not a bug and not something a header we set can
     override — a function there can never render a page. So the page lives on our own domain instead.

     Static, not a React route: somebody clicking unsubscribe in their inbox is often on a strange device
     and a bad connection, and this must not depend on the app bundle, on auth, or on the service worker
     having warmed up. It is one file with no imports.

     It also keeps supabase.co OUT of the visible email. A link whose domain has nothing to do with the
     sending domain is a real spam signal, and this domain also carries the password resets. The
     List-Unsubscribe HEADER still points at the function, because Gmail POSTs to that one directly. -->

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Ubuntu, system-ui, -apple-system, sans-serif;
    background: #1f343b; color: #fff;
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
  }
  .card {
    background: #058890; border: 3px solid #000; border-radius: 20px;
    padding: 28px 30px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 12px; font-size: 22px; line-height: 1.25; }
  p  { margin: 0 0 20px; font-size: 15px; line-height: 1.55; }
  a.btn {
    display: inline-block; background: #fff0d3; color: #1c1a1f; text-decoration: none;
    font-weight: 700; border: 3px solid #000; border-radius: 999px; padding: 11px 22px;
  }
  a.btn:hover { transform: translateY(-1px); }
  .muted { opacity: .85; font-size: 13px; margin-bottom: 0; }
</style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <h1 id="t">One moment</h1>
    <p id="b">Turning your announcement emails off.</p>
    <a class="btn" href="https://app.rudimentaldrummingmastery.com">Open the app</a>
  </div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var u = q.get("u") || "", t = q.get("t") || "";
  var T = document.getElementById("t"), B = document.getElementById("b");
  var say = function (title, body) { T.textContent = title; B.textContent = body; };

  if (!u || !t) {
    say("That link is incomplete",
        "Some email apps cut long links in half. You can turn announcement emails off inside the app, on the Announcements page.");
    return;
  }

  /* POST, not GET: the function answers a POST with a bare 200 (that is the shape Gmail's own one-click
     button uses), so we get a clean yes/no with nothing to parse. */
  fetch("https://sktkxtyiyvjwzucvpipw.supabase.co/functions/v1/announce-unsubscribe"
        + "?u=" + encodeURIComponent(u) + "&t=" + encodeURIComponent(t), { method: "POST" })
    .then(function (r) {
      if (r.ok) {
        say("You are unsubscribed",
            "You will not get announcement emails any more. Anything Anthony posts is still waiting for you in the app, and you can turn these back on there whenever you like.");
      } else if (r.status === 400) {
        say("That link is not valid",
            "It may have been cut short by your email app. You can turn announcement emails off inside the app, on the Announcements page.");
      } else {
        say("Something went wrong",
            "Try the link again in a minute, or turn announcement emails off inside the app.");
      }
    })
    .catch(function () {
      say("Could not reach the server",
          "Check your connection and try again, or turn announcement emails off inside the app.");
    });
})();
</script>
</body>
</html>
