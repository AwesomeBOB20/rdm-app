<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="stylesheet" href="/fonts/ubuntu.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>RDM</title>
    <!-- Share + search preview. Without these, a link to the app pasted into a DM or a search result was
         a bare "RDM" with no description or image; RDM markets on Instagram, so shared links matter.
         (Anthony, 2026-07-22) -->
    <meta name="description" content="The RDM practice tools: 500+ looping Playalongs, a Sight-Reading Lab, and a marching Metronome. Get clean, fast." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rudimental Drumming Mastery" />
    <meta property="og:title" content="RDM Practice Tools" />
    <meta property="og:description" content="500+ looping Playalongs, a Sight-Reading Lab, and a marching Metronome. Get clean hands, fast." />
    <meta property="og:url" content="https://app.rudimentaldrummingmastery.com/" />
    <!-- 1200x630, teal to every edge. This used to point at icons/icon-512.png, which is a SQUARE with
         opaque white corners: Messages/iMessage/Slack pillarboxed it in white and the rounded corners
         showed. summary_large_image (was "summary") is what makes the preview render wide instead of as
         a thumbnail beside the text. (Anthony, 2026-07-26) -->
    <meta property="og:image" content="https://app.rudimentaldrummingmastery.com/og-rdm.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rudimental Drumming Mastery" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RDM Practice Tools" />
    <meta name="twitter:description" content="500+ looping Playalongs, a Sight-Reading Lab, and a marching Metronome. Get clean hands, fast." />
    <meta name="twitter:image" content="https://app.rudimentaldrummingmastery.com/og-rdm.png" />
    <!-- theme-color = the app's bottom-nav colour (#1f1e27 / --nav-bg), NOT the page background.
         Proven by two device screenshots (Anthony, 2026-07-23): Chrome for Android tints the bottom
         SYSTEM navigation bar from THIS meta tag, and with it set to the page bg (#234048) that OS bar
         did not match the app's own #1f1e27 bottom bar. Matching it here makes them line up in Chrome.
         Chrome no longer tints the TOP toolbar from theme-color in dark mode (it stays its own near
         black in the screenshots), so pointing this at the nav colour costs nothing up top.
         Caveat that no web page can fix: other browsers derive the OS bar differently (Firefox renders
         it near black regardless), so a guaranteed match on every browser only comes from the installed
         build, where the manifest theme_color (also #1f1e27) drives the native navigationBarColor. -->
    <meta name="theme-color" content="#1f343b" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- iOS ignores the manifest's icons and uses this one. Generated by dev/make-icons.js: the logo on
         the brand blue with room around it, rather than the bare artwork edge to edge. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Painted BEFORE any stylesheet or script loads, so the browser never shows its default white.
         The app background lives in index.css, which only arrives with the JS bundle. -->
    <style>
      /* The ROOT background is #1f343b (--nav-bg), NOT the #234048 dim-average the visible surfaces use.
          Chrome on Android tints the bottom system navigation bar from the html element's background
          colour — not the rendered pixels, not the meta theme-color, the ROOT background. So this is
          the one lever that colours the OS bar. Set it here (before any CSS bundle loads) AND in
          index.css body { background } so both the first paint and every paint after are identical.
          The root is never itself visible (the #boot splash, then .shell, both cover it with the dimmed
          brand image), so the visible load colour is always #234048 — only the OS-bar sample uses this.
          --nav-bg = #1f343b (0.72 dim average of the brand background). (Anthony, 2026-07-28) */
      html { background-color: #1f343b; color-scheme: dark; }
      body { margin: 0; background-color: #1f343b; }

      /* The launch screen lives in the HTML, not in React, so it paints on the FIRST frame — at the same
         moment as the background, before a single byte of JS has run. Built as a React component it
         couldn't appear until the bundle downloaded and mounted, which left a beat of bare dark first.
         Everything here is self-contained (no CSS bundle, no webfont) for the same reason.
         React removes it when the app is ready — see dismissBootSplash() in src/main.jsx. */
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background-color: #234048;
        /* the identical layer the app shell uses (.shell in App.css), so when this fades there is
           literally nothing to see change behind it. This drifted out of sync once before — .shell's
           dim moved from a 0.40/0.52 gradient to a flat 0.72 and back down to 0.62, and this hard-coded
           copy was never updated, so the boot splash and the app it hands off to were dimmed
           differently. If you change .shell's dim again, update this line too. (Anthony, 2026-07-23) */
        background-image: linear-gradient(rgba(20,18,22,.62), rgba(20,18,22,.62)), url(/rdm-bg.svg);
        background-size: cover; background-position: center;
        opacity: 1; transition: opacity 420ms ease;
      }
      #boot.is-leaving { opacity: 0; pointer-events: none; }
      #boot .b-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      /* background-color is LOAD-BEARING, not decoration (Anthony, 2026-08-18: "I want you to put that
         blue on the splash screen... for that little logo medallion thing").
         rdm-logo.png is transparent, so without a fill the dimmed brand photo showed through the
         rounded box and the logo read as murky dark blue — different from the teal square users see on
         their home screen and in the store. #058890 is --blue-deep, the same teal baked into the app
         icon, so splash / launcher / store listing now all show the medallion on the same ground. */
      #boot img {
        width: 120px; height: 120px; border-radius: 28px;
        background-color: #058890;
        border: 3px solid #000; box-shadow: 0 6px 18px rgba(0,0,0,.35);
        animation: b-rise .5s cubic-bezier(.2,.8,.2,1) both;
      }
      #boot .b-name {
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        font-family: Ubuntu, system-ui, sans-serif; text-transform: uppercase;
        color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 3.4px; line-height: 1.3;
        text-shadow: 0 2px 6px rgba(0,0,0,.45);
        animation: b-rise .5s cubic-bezier(.2,.8,.2,1) .06s both;
      }
      /* SONAR (Anthony, 2026-11-06, from the mock-up: "1a is best but can you make it look like a sonar beam where like the animation is slower and each overlap a bit", then on the
         first build: "the sonars look glitchy and slow and laggy"). Four lights with a small black border, first one purple. Each pings and rings outward far enough to reach the next
         light. A step is 0.5s and a ping lasts about 0.95s, so each is still going when the next starts.
         ⚠️ THE RING IS DRAWN AT ITS FULL SIZE AND SCALED UP TO IT, never drawn small and blown up: the first build scaled a 2px ring 3.6 times, a thick blocky band by the end. Opacity
         and transform only, so they keep time while the app is busy starting up behind them. */
      #boot .b-dots { display: flex; gap: 16px; height: 18px; margin-top: 10px; align-items: center; }
      #boot .b-dots i { position: relative; display: block; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid #000; }
      #boot .b-dots i::after, #boot .b-dots i::before { content: ""; position: absolute; border-radius: 50%; opacity: 0; will-change: transform, opacity; animation: 2s cubic-bezier(.2,.6,.35,1) infinite; }
      #boot .b-dots i::after { inset: -2px; background: #06aeb9; border: 2px solid #000; animation-name: b-ping; }
      /* (Anthony, 2026-11-06: "a bit thicker and is actually centered on the circles".) border-box is what centers it: without it the border sat outside the 60px and the ring ran 2px low and right. */
      #boot .b-dots i::before { box-sizing: border-box; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border: 3px solid #06aeb9; animation-name: b-ring; }
      #boot .b-dots i:nth-child(1)::after { background: #96318d; }
      #boot .b-dots i:nth-child(1)::before { border-color: #d276ca; }
      #boot .b-dots i:nth-child(2)::after, #boot .b-dots i:nth-child(2)::before { animation-delay: .5s; }
      #boot .b-dots i:nth-child(3)::after, #boot .b-dots i:nth-child(3)::before { animation-delay: 1s; }
      #boot .b-dots i:nth-child(4)::after, #boot .b-dots i:nth-child(4)::before { animation-delay: 1.5s; }
      #boot.is-leaving img { transform: scale(1.04); transition: transform 420ms ease; }
      @keyframes b-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes b-ping { 0% { opacity: 1; transform: scale(1.14); } 8% { opacity: 1; transform: scale(1); } 46% { opacity: 0; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      @keyframes b-ring { 0% { opacity: .8; transform: scale(.27); } 48% { opacity: 0; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot .b-name { animation: none; }
        #boot .b-dots i::after, #boot .b-dots i::before { animation: none; }
        #boot .b-dots i:nth-child(1)::after { opacity: 1; }
        #boot.is-leaving img { transform: none; }
      }
    </style>
    <!-- THEME, APPLIED BEFORE THE FIRST PAINT.
         Everything above this point (the root background, the boot splash, the theme-color meta) is
         hard-coded for the default RDM look, and it has to be: it paints before any CSS bundle or module
         exists. A student on a theme would therefore get an untouched-brand launch screen and an
         untouched-brand Android system bar, then watch the app arrive in a different colour — and the OS
         bar would simply STAY wrong, because Chrome samples the html element's background colour and
         nothing later re-samples it.

         So this runs first, synchronously, from the same localStorage key src/appearance.js owns, and
         AFTER the static <style> block above rather than before it — cascade order matters here: both
         set `html`'s background-color at equal specificity, and the LATER one in the document wins. This
         was written before the static block on the first attempt, which is why it silently lost every
         time (proven with a real page load, not assumed — getComputedStyle kept reading the static
         literal no matter what this script set). A classic inline script is deliberate: a module script
         is deferred and would run AFTER the first paint, which is the whole thing being avoided.

         The map is a COPY of --nav-bg / --boot-bg from each palette in src/index.css. It cannot import
         them (no bundle yet), so dev-harness/_navbg-check.cjs asserts the two agree and fails loudly if
         a theme is added or edited here without the other. -->
    <script>
      (function () {
        var NAV = { purple: "#3f223e", teal: "#0f3a40", orange: "#492512" };
        var BOOT = { purple: "#4e284c", teal: "#0d484f", orange: "#5b2c10" };
        try {
          var t = (JSON.parse(localStorage.getItem("rdm.appearance") || "{}") || {}).theme;
          if (!t || !NAV[t]) return;                      // unknown or "rdm" -> the literals above stand
          document.documentElement.setAttribute("data-theme", t);
          var st = document.createElement("style");
          // same three surfaces the static <style> block above sets, overridden for this theme
          st.textContent = "html,body{background-color:" + NAV[t] + "}#boot{background-color:" + BOOT[t] + "}";
          document.head.appendChild(st);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", NAV[t]);
        } catch (e) { /* storage off / private mode — the default RDM colours above are correct */ }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-RLHyu_aP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-lk6Hbi2P.css">
  </head>
  <body>
    <div id="boot">
      <div class="b-wrap">
        <img src="/rdm-logo.webp" alt="" />
        <div class="b-name"><span>Rudimental</span><span>Drumming</span><span>Mastery</span></div>
        <div class="b-dots" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
