
<div class="app-shell">

  <!-- BEATS — full width, floating on the background, no panel -->
  <div class="metro-lights" id="metroLights" aria-label="Beat accents (click to change)"></div>

  <!-- NUMBER + steppers, centered -->
  <div class="metro-display">
    <div class="metro-stack">
      <button class="stepbtn" id="bpmDec1" type="button" aria-label="Tempo −1">−1</button>
      <button class="stepbtn" id="bpmDec5" type="button" aria-label="Tempo −5">−5</button>
    </div>
    <div class="metro-bpm">
      <span class="bignum" id="bpmBig">120</span>
      <span class="unit">BPM</span>
    </div>
    <div class="metro-stack">
      <button class="stepbtn" id="bpmInc1" type="button" aria-label="Tempo +1">+1</button>
      <button class="stepbtn" id="bpmInc5" type="button" aria-label="Tempo +5">+5</button>
    </div>
  </div>
  <!-- (The live-notation sheet card was removed — the Subdivision settings button now shows the rhythm.) -->

  <!-- Rhythm SEQUENCE: one chip per step, each showing that step's rhythm icon + how many beats it
       lasts. Tapping a chip selects it, and the Subdivision picker + accent pills below then edit THAT
       step. A single ×1 step is exactly the old single-rhythm metronome, so the row hides itself until
       there is more than one step. -->
  <div class="metro-seq" id="seqRow" hidden aria-label="Rhythm sequence"></div>

  <!-- Subdivision accent pills: click a partial to cycle normal → accent → mute. -->
  <div class="metro-sublights" id="subLights" aria-label="Subdivision accents (click to change)"></div>

  <!-- ONE control card -->
  <section class="metro-card panel blue">
    <!-- transport -->
    <div class="ctl-transport">
      <button class="cta play" id="playBtn" type="button" aria-pressed="false" title="Start / stop (Space)"><svg class="ico ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
      <div class="rangewrap">
        <div class="rangetrack"><div class="rangefill" id="tempoFill"></div></div>
        <input type="range" class="slider" id="tempoSlider" min="0" max="300" value="120" step="1" aria-label="Tempo" />
      </div>
      <div class="bpmbox" id="tempoBox"><span class="bpmnote" id="tempoNote" aria-hidden="true">&#9833; =</span><input class="bpminput" id="tempoInput" type="text" inputmode="numeric" maxlength="3" value="120" aria-label="Tempo in BPM" /></div>
      <button class="cta" id="tapBtn" type="button" title="Tap tempo">TAP</button>
      <button class="kbdbtn" id="kbdBtn" type="button" title="Keyboard shortcuts (press /)" aria-label="Keyboard shortcuts"><svg class="ico ico-stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6.01" y2="10"></line><line x1="10" y1="10" x2="10.01" y2="10"></line><line x1="14" y1="10" x2="14.01" y2="10"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><line x1="7" y1="14" x2="17" y2="14"></line></svg></button>
    </div>

    <!-- settings: caption ABOVE each button, anchored top-left, outside the box (desktop only — see CSS) -->
    <div class="ctl-settings">
      <div class="ctl-item">
        <span class="ctl-lbl">Time Signature</span>
        <button class="control icon-only" id="timeSigBtn" type="button" data-picker="timeSigSel" data-title="Time Signature" aria-label="Time Signature"><span class="tsIcon" aria-hidden="true"></span></button>
      </div>
      <div class="ctl-item ctl-item--wide">
        <span class="ctl-lbl">Subdivision</span>
        <button class="control icon-only" id="subdivBtn" type="button" data-picker="subdivSel" data-title="Subdivision" aria-label="Subdivision"><span class="subIcon" aria-hidden="true"></span></button>
      </div>
      <div class="ctl-item">
        <span class="ctl-lbl">Sound</span>
        <button class="control icon-only" id="soundBtn" type="button" data-picker="soundSel" data-title="Click sound" aria-label="Click sound"><span class="soundIcon" aria-hidden="true"><svg viewBox="0 0 24 24" width="36" height="36"><polygon points="4,9 8,9 12,5 12,19 8,15 4,15" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
      </div>
    </div>
  </section>

  <!-- TRAINER TABS — Tempo = purple, Gap = orange, Presets = teal. Click a tab (icon/label) to open its
       panel; only ONE panel is open at a time (openTrainerPanel in script.js). The Tempo/Gap ON/OFF switches
       activate their trainer independently, so both trainers can still RUN at once with their panels closed.
       Presets has no switch — it isn't an activatable mode. -->
  <div class="tt-tabs">
    <div class="tt-tab tt-tab--teal">
      <button type="button" class="tt-tab-info" id="ttExpand" aria-expanded="false" aria-controls="ttBody">
        <span class="tt-tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><g transform="translate(0,3.2)"><path d="M12 4a8 8 0 0 0-8 8h2.5a5.5 5.5 0 0 1 5.5-5.5 5.5 5.5 0 0 1 5.5 5.5H20a8 8 0 0 0-8-8z" fill="currentColor"/><path d="M12 12l3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></g></svg></span>
        <span class="tt-tab-lbl">Bump Tempo</span>
        <span class="tt-tab-chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <label class="tt-toggle"><input type="checkbox" id="ttToggle" aria-label="Activate Bump Tempo" /><span class="track"><span class="tlbl">OFF</span><span class="tlbl">ON</span></span></label>
    </div>
    <div class="tt-tab tt-tab--orange">
      <button type="button" class="tt-tab-info" id="gapExpand" aria-expanded="false" aria-controls="gapBody">
        <span class="tt-tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="5" height="10" rx="1.5" fill="currentColor"/><rect x="9.5" y="7" width="5" height="10" rx="1.5" fill="currentColor"/><rect x="17" y="7" width="5" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
        <span class="tt-tab-lbl">Gap Trainer</span>
        <span class="tt-tab-chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <label class="tt-toggle"><input type="checkbox" id="gapToggle" aria-label="Activate Gap Trainer" /><span class="track"><span class="tlbl">OFF</span><span class="tlbl">ON</span></span></label>
    </div>
    <div class="tt-tab tt-tab--purple" id="presetsTab" hidden>
      <button type="button" class="tt-tab-info" id="presetsExpand" aria-expanded="false" aria-controls="presetsBody">
        <span class="tt-tab-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <span class="tt-tab-lbl">Presets</span>
        <span class="tt-tab-chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </div>

  <!-- TEMPO TRAINER panel — ramp the tempo by a signed step every N bars (positive = speed up, negative = slow down) -->
  <section class="metro-card tt-card tt-panel" id="ttBody" hidden>
    <div class="tt-status" id="ttStatus" aria-live="polite"></div>
    <div class="tt-grid tt-grid--4">
      <label class="tt-field"><span class="tt-lab">Start</span><input class="tt-num" id="ttStart" type="text" inputmode="numeric" maxlength="3" value="120" placeholder="120" aria-label="Start tempo" /></label>
      <label class="tt-field"><span class="tt-lab">Target</span><input class="tt-num" id="ttTarget" type="text" inputmode="numeric" maxlength="3" value="180" placeholder="180" aria-label="Target tempo" /></label>
      <label class="tt-field"><span class="tt-lab">Step</span><input class="tt-num" id="ttStep" type="text" inputmode="text" maxlength="4" value="+5" placeholder="+5" aria-label="Tempo step, positive up or negative down" /></label>
      <label class="tt-field"><span class="tt-lab">Every</span><input class="tt-num" id="ttEvery" type="text" inputmode="numeric" maxlength="2" value="4" placeholder="4" aria-label="Bars between steps" /></label>
    </div>
  </section>

  <!-- GAP TRAINER panel — play N bars, then go silent M bars (hold time internally), repeat -->
  <section class="metro-card tt-card tt-panel" id="gapBody" hidden>
    <div class="tt-status" id="gapStatus" aria-live="polite"></div>
    <div class="tt-grid">
      <label class="tt-field"><span class="tt-lab">Play</span><input class="tt-num" id="gapPlay" type="text" inputmode="numeric" maxlength="2" value="1" placeholder="1" aria-label="Bars of clicks" /></label>
      <label class="tt-field"><span class="tt-lab">Silent</span><input class="tt-num" id="gapGap" type="text" inputmode="numeric" maxlength="2" value="1" placeholder="1" aria-label="Bars of silence" /></label>
    </div>
  </section>

  <!-- PRESETS panel — save/load the whole click setup to your account (revealed only when signed in) -->
  <section class="metro-card tt-card tt-panel" id="presetsBody" hidden>
    <div class="metro-presets" id="metroPresets"></div>
  </section>

</div>

<!-- Keyboard shortcuts popup (desktop). Opened by the ⌨ button or the / key; closed by Esc / click-outside. -->
<div class="kbdhelp" id="kbdHelp" hidden>
  <div class="kbdhelp__panel" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <div class="kbdhelp__head">
      <h2 class="kbdhelp__title">Keyboard Shortcuts</h2>
      <button class="kbdhelp__close" id="kbdHelpClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="kbdhelp__grid">
      <section class="kbdhelp__group">
        <h3>Transport</h3>
        <div class="kbdrow"><span class="kbdrow__keys"><kbd>Space</kbd> <kbd>K</kbd></span><span class="kbdrow__desc">Start / stop</span></div>
        <div class="kbdrow"><span class="kbdrow__keys"><kbd>T</kbd></span><span class="kbdrow__desc">Tap tempo</span></div>
      </section>
      <section class="kbdhelp__group">
        <h3>Tempo</h3>
        <div class="kbdrow"><span class="kbdrow__keys"><kbd>↑</kbd> <kbd>↓</kbd></span><span class="kbdrow__desc">Tempo +1 / −1</span></div>
        <div class="kbdrow"><span class="kbdrow__keys"><kbd>←</kbd> <kbd>→</kbd></span><span class="kbdrow__desc">Tempo −1 / +1</span></div>
        <div class="kbdrow"><span class="kbdrow__keys"><kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd></span><span class="kbdrow__desc">Tempo ±5</span></div>
      </section>
    </div>
    <p class="kbdhelp__foot">Press <kbd>/</kbd> anytime to open this. Click a beat or sub light to cycle accent → rest.</p>
  </div>
</div>

<!-- Hidden <select> elements = source of truth for the pickers -->
<div hidden aria-hidden="true">
  <select id="timeSigSel">
    <option value="2/4">2/4</option>
    <option value="3/4">3/4</option>
    <option value="4/4" selected>4/4</option>
    <option value="5/4">5/4</option>
    <option value="6/4">6/4</option>
    <option value="6/8">6/8</option>
    <option value="9/8">9/8</option>
    <option value="12/8">12/8</option>
    <option value="5/8">5/8</option>
    <option value="7/8">7/8</option>
  </select>
  <select id="subdivSel">
    <option value="1/1" selected>Quarters</option>
    <option value="4/3">Dotted 8ths</option>
    <option value="3/2">Quarter Triplets</option>
    <option value="2/1">8th Notes</option>
    <option value="9/4">8th 9-lets</option>
    <option value="5/2">8th 5-lets</option>
    <option value="8/3">4:3s</option>
    <option value="3/1">Triplets</option>
    <option value="10/3">5:3s</option>
    <option value="7/2">8th 7-lets</option>
    <option value="4/1">16th Notes</option>
    <option value="9/2">9-lets</option>
    <option value="14/3">7:3s</option>
    <option value="5/1">5-lets</option>
    <option value="6/1">6-lets</option>
    <option value="7/1">7-lets</option>
    <option value="8/1">32nd Notes</option>
  </select>
  <select id="soundSel"><option value="beep" selected>Beep</option><option value="click">Click</option><option value="wood">Wood</option><option value="clave">Clave</option><option value="analog">Analog</option></select>
</div>

<!-- Shared picker modal (teal theme) -->
<div class="modal theme-teal" id="picker" hidden>
  <div class="modal__stack">
    <div class="modal__panel modal__head">
      <h3 id="pickerTitle">Select</h3>
      <input class="modal__search" id="pickerSearch" type="text" placeholder="Search…" autocomplete="off" />
      <button class="modal__close" id="pickerClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="modal__panel modal__listwrap">
      <ul class="modal__list" id="pickerList"></ul>
    </div>
  </div>
</div>
